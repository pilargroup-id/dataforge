name: Deploy Dataforge

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Production
    runs-on:
      - self-hosted
      - windows
      - x64

    timeout-minutes: 20

    env:
      DEPLOY_DIR: C:\dataforge
      PM2_HOME: C:\Users\MULTI DAYA\.pm2

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # FRONTEND
      # ==========================================
      - name: Install frontend dependencies
        shell: powershell
        working-directory: frontend
        run: |
          if (Test-Path "package-lock.json") {
            npm ci --include=dev
          } else {
            npm install --include=dev
          }

      - name: Build frontend
        shell: powershell
        working-directory: frontend
        run: |
          npm run build

      # ==========================================
      # DEPLOY BACKEND
      # ==========================================
      - name: Deploy backend
        shell: powershell
        run: |
          $source = "$env:GITHUB_WORKSPACE\backend"
          $target = "$env:DEPLOY_DIR\backend"

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          robocopy `
            $source `
            $target `
            /E `
            /XD node_modules `
            /XF .env .env.local

          $code = $LASTEXITCODE

          if ($code -ge 8) {
            throw "Backend deployment failed. Robocopy exit code: $code"
          }

          $global:LASTEXITCODE = 0

      # ==========================================
      # DEPLOY FRONTEND BUILD
      # ==========================================
      - name: Deploy frontend build
        shell: powershell
        run: |
          $source = "$env:GITHUB_WORKSPACE\frontend\dist"
          $target = "$env:DEPLOY_DIR\frontend\dist"

          New-Item -ItemType Directory -Force -Path $target | Out-Null

          robocopy `
            $source `
            $target `
            /MIR

          $code = $LASTEXITCODE

          if ($code -ge 8) {
            throw "Frontend deployment failed. Robocopy exit code: $code"
          }

          $global:LASTEXITCODE = 0

      # ==========================================
      # BACKEND DEPENDENCIES
      # ==========================================
      - name: Install backend production dependencies
        shell: powershell
        run: |
          Set-Location "$env:DEPLOY_DIR\backend"

          if (Test-Path "package-lock.json") {
            npm ci --omit=dev
          } else {
            npm install --omit=dev
          }

      # ==========================================
      # PM2
      # ==========================================
      - name: Restart Dataforge
        shell: powershell
        run: |
          Set-Location "$env:DEPLOY_DIR\backend"

          $env:NODE_ENV = "production"
          $env:APP_PORT = "8007"

          pm2 describe dataforge *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Restarting existing Dataforge process..."
            pm2 restart dataforge --update-env
          }
          else {
            Write-Host "Starting Dataforge..."
            pm2 start src/server.js `
              --name dataforge `
              --cwd "$env:DEPLOY_DIR\backend"
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start/restart Dataforge."
          }

          pm2 list

      # ==========================================
      # HEALTH CHECK
      # ==========================================
      - name: Health check
        shell: powershell
        run: |
          $healthy = $false

          for ($attempt = 1; $attempt -le 10; $attempt++) {
            Write-Host "Health check attempt $attempt/10..."

            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:8007/health" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Write-Host "Dataforge not ready yet."
            }

            Start-Sleep -Seconds 3
          }

          if (-not $healthy) {
            Write-Host ""
            Write-Host "===== PM2 STATUS ====="
            pm2 list

            Write-Host ""
            Write-Host "===== DATAFORGE LOGS ====="
            pm2 logs dataforge --lines 50 --nostream

            throw "Dataforge health check failed."
          }

          Write-Host "Dataforge health check passed."

      # ==========================================
      # SAVE PM2
      # ==========================================
      - name: Save PM2 process list
        shell: powershell
        run: |
          pm2 save